name: Sync Metamodel Data

on:
  repository_dispatch:
    types: [metamodel-updated]
  workflow_dispatch:
  schedule:
    # Hourly safety net in case repository_dispatch is missed.
    - cron: '0 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout technehub-labs.github.io
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout dea-metamodel viewer artifacts
        uses: actions/checkout@v4
        with:
          repository: technehub-labs/dea-metamodel
          ref: main
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: dea-metamodel-source
          sparse-checkout: |
            viewer
            metamodel-puml

      - name: Copy viewer artifacts into site
        run: |
          set -euo pipefail
          mkdir -p metamodel
          cp dea-metamodel-source/viewer/entity-graph.json        metamodel/entity-graph.json
          cp dea-metamodel-source/viewer/entity-graph.schema.json metamodel/entity-graph.schema.json
          cp dea-metamodel-source/viewer/metamodel.svg            metamodel/metamodel.svg
          # Canonical PlantUML source — the dea-web-viewer SPA parses
          # this at runtime (/data/metamodel.puml), so it MUST be
          # published here for the downstream sync to pick it up.
          cp dea-metamodel-source/metamodel-puml/metamodel-v2.puml metamodel/metamodel.puml

          # Validate JSON.
          python3 -c "import json; json.load(open('metamodel/entity-graph.json'))"
          python3 -c "import json; json.load(open('metamodel/entity-graph.schema.json'))"
          # Validate PUML is a plausible PlantUML source.
          head -1 metamodel/metamodel.puml | grep -q '^@startuml'

      - name: Commit if changed
        run: |
          git config user.name "coder-bot"
          git config user.email "software.engineer@technehub.com"
          if git diff --quiet metamodel/; then
            echo "No changes — metamodel artefacts are in sync."
          else
            git add metamodel/
            git commit -m "chore: sync metamodel artefacts (entity-graph, svg, puml) from dea-metamodel"
            git push origin main
          fi