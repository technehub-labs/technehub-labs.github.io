name: Sync Business Capabilities

# Mirrors the canonical published artifacts from
# technehub-labs/dea-catalog-business-capabilities (CR-DEA-BC-06 publication
# pipeline) into this Pages repo's capabilities/ subdirectory so the live
# landing page at https://technehub-labs.github.io/capabilities/ always
# reflects the latest tagged release of the catalog.
#
# Sync scope:
#   release asset <version>.zip
#     → capabilities/<version>/     (immutable versioned viewer)
#     → capabilities/latest/         (mutable mirror of latest tag)
#     → portal/data/capabilities.json (in-portal Explorer consumption)
#
# Source of truth: GitHub Releases on the BC repo (not the source-repo
# working tree). Each versioned tag publishes a <version>.zip asset via
# publish-versioned.yml. This workflow fetches the release asset, so the
# Pages state mirrors exactly what was published, not any transient main.
#
# Triggers (canonical mechanism is hourly cron — no cross-repo secret needed):
#   - schedule (hourly cron)         — primary sync, picks up new releases
#                                       within ~1 hour of publish
#   - workflow_dispatch             — manual run for testing / emergency sync
#   - repository_dispatch            — retained as an OPT-IN fast path for when
#     [capabilities-versioned]         a DISPATCH_TOKEN secret is configured on
#     [capabilities-updated]          the source repo. Currently no such secret
#                                       is configured there; the hourly cron is
#                                       the only active trigger.
#
# Why hourly cron (not push-to-main dispatch):
#   Cross-repo `repository_dispatch` from dea-catalog-business-capabilities
#   to this Pages repo requires a PAT stored as `DISPATCH_TOKEN` on the
#   source repo. Until that secret is configured, the hourly cron is
#   sufficient: source-side releases land in the live Pages tree within
#   ~60 minutes, which is acceptable for the BC release cadence (lettered
#   suffix versions, ~once/day at peak). Adding `DISPATCH_TOKEN` later will
#   give sub-minute latency without any further workflow changes here.
#
# Same-origin rule: we copy artifacts into this Pages repo and serve them
# from the capabilities/ subdirectory. The portal page fetches
# ./latest/catalog.json (same-origin), avoiding raw.githubusercontent.com
# CDN 404 pitfalls.
#
# Pattern mirror: see sync-metaframework.yml and sync-metamodel.yml in this
# directory. Same checkout + validation + commit-if-changed structure,
# adapted for the BC repo's release-zip artifact source.

on:
  repository_dispatch:
    types: [capabilities-versioned, capabilities-updated]
  workflow_dispatch:
  schedule:
    # Canonical sync — hourly. Picks up all source-side releases within ~1h
    # without requiring any cross-repo secret.
    - cron: '0 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout technehub-labs.github.io
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve target version(s)
        id: targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
            if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
              # latest means "the newest tag" in release-space
              LATEST=$(gh release list --repo technehub-labs/dea-catalog-business-capabilities --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null)
              if [ -z "$LATEST" ]; then
                echo "warn: no releases in the BC repo; nothing to sync" >&2
                echo "targets=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "targets=$LATEST" >> "$GITHUB_OUTPUT"
              echo "latest_label=$LATEST" >> "$GITHUB_OUTPUT"
            else
              echo "targets=$VERSION" >> "$GITHUB_OUTPUT"
              echo "latest_label=$VERSION" >> "$GITHUB_OUTPUT"
            fi
          else
            # cron / manual: sync ALL known releases + latest
            ALL=$(gh release list --repo technehub-labs/dea-catalog-business-capabilities --limit 20 --json tagName --jq '.[].tagName' 2>/dev/null | tr '\n' ' ')
            echo "targets=$ALL" >> "$GITHUB_OUTPUT"
            LATEST=$(echo $ALL | tr ' ' '\n' | sort -V | tail -1)
            echo "latest_label=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release artifacts and unpack
        if: steps.targets.outputs.targets != ''
        run: |
          set -euo pipefail
          mkdir -p capabilities portal/data

          for label in ${{ steps.targets.outputs.targets }}; do
            # Skip if already synced at this exact content.
            if [ -d "capabilities/$label" ] && [ -s "capabilities/$label/catalog.json" ]; then
              echo "skip: capabilities/$label already present"
              continue
            fi

            # Fetch the release zip for this tag.
            ASSET_URL="https://github.com/technehub-labs/dea-catalog-business-capabilities/releases/download/$label/$label.zip"
            TMPDIR=$(mktemp -d)
            trap "rm -rf $TMPDIR" EXIT

            if ! curl -fsSL "$ASSET_URL" -o "$TMPDIR/artifacts.zip"; then
              echo "warn: release asset $label.zip not found at $ASSET_URL" >&2
              continue
            fi

            mkdir -p "capabilities/$label"
            unzip -q -o "$TMPDIR/artifacts.zip" -d "capabilities/$label/"
            echo "synced: $label -> capabilities/$label ($(ls capabilities/$label | wc -l) files)"
            rm -rf "$TMPDIR"
            trap - EXIT
          done

          # Mirror latest/ to the newest tag's content (for in-portal
          # consumption via portal/data/capabilities.json).
          LATEST_LABEL="${{ steps.targets.outputs.latest_label }}"
          if [ -n "$LATEST_LABEL" ] && [ -d "capabilities/$LATEST_LABEL" ]; then
            # Only re-copy if not already a symlink-equivalent mirror
            if ! cmp -s "capabilities/$LATEST_LABEL/catalog.json" "capabilities/latest/catalog.json" 2>/dev/null; then
              rm -rf capabilities/latest
              mkdir -p capabilities/latest
              cp -r "capabilities/$LATEST_LABEL/." capabilities/latest/
              cp capabilities/latest/catalog.json portal/data/capabilities.json
              echo "synced: capabilities/$LATEST_LABEL -> capabilities/latest + portal/data/capabilities.json"
            else
              echo "skip: capabilities/latest already matches $LATEST_LABEL"
            fi
          fi

      - name: Validate synced artifacts
        if: steps.targets.outputs.targets != ''
        run: |
          set -euo pipefail
          # Sanity assertions: every synced label must have at least
          # poster.svg and catalog.json. Skip non-directory entries
          # (e.g. capabilities/README.md).
          for label in $(ls capabilities/); do
            [ -d "capabilities/$label" ] || continue
            test -s "capabilities/$label/poster.svg" || \
              { echo "FAIL: capabilities/$label/poster.svg missing or empty" >&2; exit 1; }
            test -s "capabilities/$label/catalog.json" || \
              { echo "FAIL: capabilities/$label/catalog.json missing or empty" >&2; exit 1; }
            echo "OK: capabilities/$label — poster.svg + catalog.json present"
          done

          # Validate catalog.json schema integrity at sync time.
          python3 - <<'PY'
          import json, sys, glob
          paths = sorted(glob.glob('capabilities/*/catalog.json'))
          if not paths:
              print('WARN: no catalog.json files synced')
              sys.exit(0)
          for p in paths:
              with open(p) as h:
                  d = json.load(h)
              # catalog.json is a dict keyed by capability id (the output of
              # publish.js's loadEntities). Invariants: non-empty dict of
              # entry records, each with a name and a version.
              if not isinstance(d, dict):
                  raise SystemExit(f'FAIL: {p}: catalog.json is not a dict')
              if len(d) == 0:
                  raise SystemExit(f'FAIL: {p}: empty catalog.json')
              for key, entry in list(d.items())[:5]:
                  if not isinstance(entry, dict):
                      raise SystemExit(f'FAIL: {p}: entry {key} is not a dict')
                  if 'name' not in entry:
                      raise SystemExit(f'FAIL: {p}: entry {key} missing name field')
                  if 'version' not in entry:
                      raise SystemExit(f'FAIL: {p}: entry {key} missing version field')
              print(f"OK: {p} - {len(d)} entries")
          PY

      - name: Commit if changed
        if: steps.targets.outputs.targets != ''
        run: |
          git config user.name "capabilities-sync-bot"
          git config user.email "sync@dea-catalog-business-capabilities.local"
          if git diff --quiet capabilities/ portal/data/; then
            echo "In sync - no changes."
          else
            echo "Diff summary:"
            git diff --stat capabilities/ portal/data/ | tail -20
            git add capabilities/ portal/data/
            COMMIT_MSG="chore: sync capabilities from dea-catalog-business-capabilities"
            if [ -n "${{ github.event.client_payload.commit }}" ]; then
              COMMIT_MSG="chore: sync capabilities from dea-catalog-business-capabilities @ ${{ github.event.client_payload.commit }}"
            fi
            git commit -m "$COMMIT_MSG"
            git push origin main
          fi