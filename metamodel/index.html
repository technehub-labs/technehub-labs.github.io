<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEA Metamodel Explorer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1117'/><rect x='4' y='4' width='24' height='24' rx='3' fill='none' stroke='%232dd4bf' stroke-width='1.5'/><line x1='4' y1='12' x2='28' y2='12' stroke='%232dd4bf' stroke-width='1'/><line x1='4' y1='20' x2='28' y2='20' stroke='%232dd4bf' stroke-width='1'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>

<!-- ─── Top Navigation ─────────────────────────────── -->
<nav class="top-nav">
  <a href="https://technehub-labs.github.io/" class="nav-home">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    TechNeHub Labs
  </a>
  <div class="nav-title">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Metamodel Explorer
  </div>
  <div class="nav-meta">
    <span class="badge">v2.0.0-alpha</span>
    <span class="badge">19 entities</span>
  </div>
</nav>

<!-- ─── Layer Filter Bar ──────────────────────────── -->
<div class="layer-bar">
  <span class="layer-bar-label">Filter:</span>
  <button class="layer-btn active" data-layer="all">All</button>
  <button class="layer-btn" data-layer="L1" style="--c:#10b981">L1 · Strategic</button>
  <button class="layer-btn" data-layer="L2" style="--c:#f59e0b">L2 · Business</button>
  <button class="layer-btn" data-layer="L3" style="--c:#3b82f6">L3 · Digital</button>
  <button class="layer-btn" data-layer="L4" style="--c:#8b5cf6">L4 · Technology</button>
  <button class="layer-btn" data-layer="L5" style="--c:#ef4444">L5 · Governance</button>
  <div class="layer-bar-spacer"></div>
  <button class="legend-toggle" id="legendToggle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    Relationships
  </button>
</div>

<!-- ─── Main Canvas ───────────────────────────────── -->
<main class="canvas-wrapper" id="canvasWrapper">

  <!-- SVG relationship overlay -->
  <svg class="rel-overlay" id="relOverlay" xmlns="http://www.w3.org/2000/svg"></svg>

  <!-- Entity grid -->
  <div class="entity-grid" id="entityGrid"></div>

</main>

<!-- ─── Legend Panel ─────────────────────────────── -->
<div class="legend-panel hidden" id="legendPanel">
  <div class="legend-header">
    <h3>Relationships</h3>
    <button class="legend-close" id="legendClose">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="legend-body" id="legendBody">
    <!-- Populated by JS -->
  </div>
</div>

<!-- ─── Entity Detail Panel ──────────────────────── -->
<div class="detail-panel hidden" id="detailPanel">
  <div class="detail-header">
    <div>
      <div class="detail-layer" id="detailLayer"></div>
      <h2 class="detail-name" id="detailName"></h2>
    </div>
    <button class="detail-close" id="detailClose">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="detail-body">
    <p class="detail-desc" id="detailDesc"></p>
    <div class="detail-links">
      <a class="detail-link-card" id="detailRepoLink" href="#" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        <span>View Catalog Repo</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
      <a class="detail-link-card secondary" id="detailViewerLink" href="#" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Metamodel Context</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
    </div>
    <div class="detail-relationships" id="detailRelationships"></div>
    <div class="detail-status">
      <span class="detail-status-label">Status</span>
      <span class="detail-status-badge" id="detailStatus"></span>
    </div>
  </div>
</div>

<script src="viewer.js"></script>
</body>
</html>
