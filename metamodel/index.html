<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    The /metamodel/ route historically served a vanilla-JS class-grid viewer
    rendered from this Pages repo. That viewer has moved to its dedicated
    L2 repo: https://github.com/technehub-labs/dea-web-viewer

    Old URL:   https://technehub-labs.github.io/metamodel/
    New URL:   https://technehub-labs.github.io/dea-web-viewer/

    The new viewer is a React + Vite SPA with 5 view modes (Canonical SVG,
    Interactive topology, Matrix, Traceability, Catalog Browser) auto-synced
    from the published artefacts in this repo's metamodel/ directory.

    This redirect preserves backward-compatibility for any inbound links
    pointing at /metamodel/. The static JSON / SVG artefacts that used
    to be served alongside the old viewer remain at metamodel/ for the
    dea-web-viewer sync bot to consume.
  -->
  <meta http-equiv="refresh" content="0; url=/dea-web-viewer/">
  <title>DEA Metamodel — moved to /dea-web-viewer/</title>
  <link rel="canonical" href="/dea-web-viewer/" />
  <script>window.location.replace('/dea-web-viewer/');</script>
</head>
<body>
  <p>
    The DEA Metamodel viewer has moved.
    Redirecting to <a href="/dea-web-viewer/">/dea-web-viewer/</a>…
  </p>
</body>
</html>
