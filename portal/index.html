<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TechNeHub Labs — Enterprise Knowledge Universe</title>
  <meta name="description" content="Enter the TechNeHub Labs Enterprise Architecture ecosystem — a living, interconnected knowledge universe orbiting a Schwarzschild black hole.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2305070d'/><circle cx='16' cy='16' r='7' fill='none' stroke='%235fd4e8' stroke-width='1.5'/><circle cx='16' cy='16' r='4' fill='%2305070d'/></svg>">

  <link rel="stylesheet" href="css/portal.css">
</head>
<body>

  <div id="portal">

    <!-- Schwarzschild black hole renderer -->
    <canvas id="bh-canvas"></canvas>

    <!-- Connection lines between cards and centre -->
    <svg id="connection-svg" xmlns="http://www.w3.org/2000/svg"></svg>

    <!-- Orbiting navigation cards -->
    <div id="orbit-layer"></div>

    <!-- Brand mark -->
    <div class="brand-mark">
      <div class="brand-mark-title">TechNeHub Labs</div>
      <div class="brand-mark-sub">Enterprise Knowledge Universe</div>
    </div>

    <!-- Search hint -->
    <div class="search-hint">
      <kbd>⌘K</kbd> or <kbd>/</kbd> to search
    </div>

    <!-- HUD -->
    <div id="hud"></div>

    <!-- Quality selector -->
    <div class="quality-bar" id="quality-bar">
      <button class="quality-btn" data-quality="standard">Standard</button>
      <button class="quality-btn active" data-quality="high">High</button>
      <button class="quality-btn" data-quality="ultra">Ultra</button>
      <button class="quality-btn" data-quality="cinematic">Cinematic</button>
    </div>

  </div>

  <!-- Command palette -->
  <div id="cmdk"></div>

  <!-- Explorer overlays -->
  <div id="overlay-metamodel"></div>
  <div id="overlay-metaframework"></div>
  <div id="overlay-reports"></div>

  <!-- Main application -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
